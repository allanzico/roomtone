# Roomtone on your own machine, isolated from production (own project, volumes and env file): plain HTTP.
#   make local-up      (or: docker compose -f compose.local.yaml --env-file .env.docker up -d --build --wait)
# Settings: .env.docker (copy .env.docker.example). Open http://localhost:8088.
name: roomtone-local

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-roomtone: &roomtone
  <<: *logging
  image: roomtone:${ROOMTONE_IMAGE_TAG:-local}
  env_file: ${ROOMTONE_ENV_FILE:-.env.docker}
  environment: &environment
    APP_ENV: local
    APP_DEBUG: "false"
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/roomtone/database.sqlite
    LOG_CHANNEL: stderr
    INERTIA_SSR_ENABLED: "false"
    SERVER_NAME: ":8080"
    ROOMTONE_TLS: none
    # The app publishes events to Reverb inside the Docker network; browsers use the public host (built in).
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
  volumes:
    - database:/var/roomtone
    - storage:/app/storage
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    disable: true

services:
  web:
    <<: *roomtone
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY in .env.docker}
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: ${LOCAL_PORT:-8088}
        VITE_REVERB_SCHEME: http
    # Migrations run once, here, before the web server starts; the other services wait until it is healthy.
    command: ["sh", "-c", "php artisan migrate --force && exec frankenphp run --config /etc/frankenphp/Caddyfile"]
    # The frankenphp binary carries this file capability, and the kernel refuses to run it while the
    # capability is dropped. It binds only 8080/8443, so it is never used.
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8088}:8080"
    volumes:
      - database:/var/roomtone
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8081/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  queue:
    <<: *roomtone
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    depends_on: { web: { condition: service_healthy } }

  reverb:
    <<: *roomtone
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on: { web: { condition: service_healthy } }

  scheduler:
    <<: *roomtone
    command: ["php", "artisan", "schedule:work"]
    depends_on: { web: { condition: service_healthy } }

volumes:
  database:
  storage:
