# Roomtone in production: four services from one image, sharing the SQLite database on the "roomtone" volume.
#   docker compose --env-file .env.production up -d --build
# Variables come from .env.production (copy .env.production.example). See docs/DEPLOY.md.

x-roomtone: &roomtone
  image: roomtone:latest
  env_file: .env.production
  environment:
    SERVER_NAME: ${SERVER_NAME:-http://localhost}
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/roomtone/database.sqlite
    LOG_CHANNEL: stderr
    INERTIA_SSR_ENABLED: "false"
    # The app publishes events to Reverb inside the Docker network; browsers use the public host (baked in at build).
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
  volumes:
    - roomtone:/var/roomtone
    - storage:/app/storage
  restart: unless-stopped
  # The FrankenPHP base image probes Caddy; only "web" runs Caddy (it sets its own check below).
  healthcheck:
    disable: true

services:
  web:
    <<: *roomtone
    build:
      context: .
      args:
        # Where browsers reach Reverb: the public host, through Caddy (and Cloudflare in production).
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY in .env.production}
        VITE_REVERB_HOST: ${REVERB_PUBLIC_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PUBLIC_PORT:-80}
        VITE_REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
    # Migrations run once, here, before the web server starts; the other services wait until it is healthy.
    command: ["sh", "-c", "php artisan migrate --force && exec frankenphp run --config /etc/frankenphp/Caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - roomtone:/var/roomtone
      - storage:/app/storage
      # Caddy's certificates and state (FrankenPHP keeps them under /data and /config).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8081/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  queue:
    <<: *roomtone
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    depends_on:
      web:
        condition: service_healthy

  reverb:
    <<: *roomtone
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    <<: *roomtone
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  roomtone:
  storage:
  caddy_data:
  caddy_config:
